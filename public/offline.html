<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070A11" />
  <title>Sin conexión</title>
  <style>
    :root { color-scheme: dark light; }
    body { margin:0; min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:24px;
           background:#070A11; color:#e2e8f0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; text-align:center; }
    main { max-width:320px; }
    img { width:72px; height:72px; border-radius:20px; }
    h1 { font-size:20px; margin:18px 0 6px; }
    p { font-size:14px; line-height:1.5; color:#94a3b8; margin:0 0 20px; }
    button { background:#10b981; color:#022c22; border:0; border-radius:14px; padding:12px 20px; font-weight:700; font-size:14px; }
    @media (prefers-color-scheme: light) { body { background:#f1f5f9; color:#0f172a; } p { color:#475569; } }
  </style>
</head>
<body>
  <main>
    <img src="/icon-192.png" alt="" />
    <h1>Sin conexión</h1>
    <p>No hay internet ahora mismo. Tus movimientos guardados siguen en el dispositivo y se sincronizarán cuando vuelva la conexión.</p>
    <button onclick="location.reload()">Reintentar</button>
  </main>
</body>
</html>
